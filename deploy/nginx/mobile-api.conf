# Example snippet for a trusted TLS gateway attached to the private Compose network.
# Mount certificates at the paths below and replace the example hostname before use.
server {
    listen 443 ssl;
    server_name api.example.invalid;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/private-key.pem;

    location = /actuator/health {
        proxy_pass http://financial-service:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ^~ /mobile/v1/ {
        proxy_pass http://financial-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Replace, do not append, untrusted client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
