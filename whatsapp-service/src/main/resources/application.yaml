server:
  port: 8080

spring:
  application:
    name: whatsapp-service
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
wuzapi:
  url: ${WUZAPI_BASE_URL}
  token: ${AUTHENTICATION_API_KEY}

app:
  financial-service:
    url: ${APP_FINANCIAL_SERVICE_URL:http://financial-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
