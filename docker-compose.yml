services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_wa_finance
    restart: always
    environment:
      POSTGRES_DB: db_wa_finance
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_wa_finance
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  wuzapi:
    image: asternic/wuzapi:latest
    container_name: wuzapi
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN:?Defina WUZAPI_ADMIN_TOKEN no arquivo .env}
      - WUZAPI_GLOBAL_HMAC_KEY=${WUZAPI_HMAC_KEY:?Defina WUZAPI_HMAC_KEY no arquivo .env}
      - WUZAPI_GLOBAL_ENCRYPTION_KEY=${WUZAPI_GLOBAL_ENCRYPTION_KEY:?Defina WUZAPI_GLOBAL_ENCRYPTION_KEY no arquivo .env}
      - TZ=America/Sao_Paulo
      - WEBHOOK_FORMAT=json
    volumes:
      - wuzapi_data:/app/dbdata
    restart: unless-stopped

  whatsapp-service:
    build: ./whatsapp-service
    container_name: whatsapp-service
    expose:
      - "8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - WUZAPI_BASE_URL=http://wuzapi:8080
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      - WUZAPI_HMAC_KEY=${WUZAPI_HMAC_KEY:?Defina WUZAPI_HMAC_KEY no arquivo .env}
      - APP_FINANCIAL_SERVICE_URL=http://financial-service:8080
      - FINANCIAL_SERVICE_API_KEY=${FINANCIAL_SERVICE_API_KEY:?Defina FINANCIAL_SERVICE_API_KEY no arquivo .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
      financial-service:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    container_name: ai-service
    expose:
      - "8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - APP_FINANCIAL_SERVICE_URL=http://financial-service:8080
      - FINANCIAL_SERVICE_API_KEY=${FINANCIAL_SERVICE_API_KEY:?Defina FINANCIAL_SERVICE_API_KEY no arquivo .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      financial-service:
        condition: service_healthy

  financial-service:
    build: ./financial-service
    container_name: financial-service
    expose:
      - "8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/db_wa_finance
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - PHONE_ENCRYPTION_KEY=${PHONE_ENCRYPTION_KEY:?Defina PHONE_ENCRYPTION_KEY no arquivo .env}
      - FINANCIAL_SERVICE_API_KEY=${FINANCIAL_SERVICE_API_KEY:?Defina FINANCIAL_SERVICE_API_KEY no arquivo .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  rabbitmq_data:
  wuzapi_data:
