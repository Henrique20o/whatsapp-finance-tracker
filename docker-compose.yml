services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_wa_finance
    restart: always
    environment:
      POSTGRES_DB: db_wa_finance
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_wa_finance
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  wuzapi:
    image: asternic/wuzapi:latest
    container_name: wuzapi
    ports:
      - "8080:8080"
    environment:
      - WUZAPI_ADMIN_TOKEN=chavesecretacabulosa2000
      - TZ=America/Sao_Paulo
      - WEBHOOK_FORMAT=json
    restart: unless-stopped

  whatsapp-service:
    build: ./whatsapp-service
    container_name: whatsapp-service
    ports:
      - "8082:8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - WUZAPI_BASE_URL=http://wuzapi:8080
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
    depends_on:
      - rabbitmq

  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "8083:8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - APP_FINANCIAL_SERVICE_URL=http://financial-service:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - rabbitmq

  financial-service:
    build: ./financial-service
    container_name: financial-service
    ports:
      - "8084:8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/db_wa_finance
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    depends_on:
      - rabbitmq
      - postgres

volumes:
  postgres_data:
  rabbitmq_data: